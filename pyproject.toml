[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tqqq-desk"
version = "0.1.0"
description = "Systematic daily-swing TQQQ / SQQQ / cash trading system (Alpaca, paper by default)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alpaca-py>=0.40",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "streamlit>=1.35",
  "pandas_market_calendars>=4.4",
  "pyyaml>=6.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tqqq-desk = "tqqq_desk.run_daily:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
